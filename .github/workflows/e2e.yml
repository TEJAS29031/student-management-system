name: E2E Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  e2e-selenium-tests:
    name: E2E Selenium Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Chrome and ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Start Streamlit Application
      run: |
        streamlit run app.py --server.port=8501 --server.headless=true &
        echo $! > streamlit.pid
        sleep 15
        curl http://localhost:8501 || echo "Streamlit not ready yet"
        sleep 5
    
    - name: Wait for Application to be Ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8501/_stcore/health; do sleep 2; done'
    
    - name: Run Selenium E2E Tests
      run: |
        pytest tests/test_selenium.py -v --tb=short --maxfail=1
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: selenium-test-results
        path: |
          *.log
          screenshots/
        retention-days: 7
    
    - name: Stop Streamlit Application
      if: always()
      run: |
        if [ -f streamlit.pid ]; then
          kill $(cat streamlit.pid) || true
        fi
        pkill -f streamlit || true