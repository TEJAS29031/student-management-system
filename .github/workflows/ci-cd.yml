name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        run: pytest tests/test_database.py -v

  frontend-test:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install selenium pytest

      - name: Run frontend (Selenium)
        run: |
          streamlit run app.py &
          sleep 10
          pytest tests/test_selenium.py -v

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t student-management-system .

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Deploy Step
        run: echo "Deployment successful 🚀"