name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Unit Tests
      run: |
        pytest tests/test_database.py -v --tb=short
    
    - name: Check code quality
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    needs: backend-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Chrome and ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
    - name: Start Streamlit App
      run: |
        streamlit run app.py --server.port=8501 --server.headless=true &
        sleep 10
      
    - name: Run Selenium Tests
      run: |
        pytest tests/test_selenium.py -v --tb=short
      
    - name: Stop Streamlit
      if: always()
      run: |
        pkill -f streamlit || true

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker Image
      run: |
        docker build -t student-management-system:latest .
    
    - name: Test Docker Image
      run: |
        docker run -d -p 8501:8501 --name test-app student-management-system:latest
        sleep 15
        curl -f http://localhost:8501/_stcore/health || exit 1
        docker stop test-app
        docker rm test-app
    
    - name: Save Docker Image
      run: |
        docker save student-management-system:latest | gzip > student-management-system.tar.gz
    
    - name: Upload Docker Image Artifact
      uses: actions/upload-artifact@v3
      with:
        name: docker-image
        path: student-management-system.tar.gz
        retention-days: 7

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Download Docker Image
      uses: actions/download-artifact@v3
      with:
        name: docker-image
    
    - name: Load Docker Image
      run: |
        docker load < student-management-system.tar.gz
    
    - name: Display Deployment Info
      run: |
        echo "✅ Docker image built successfully!"
        echo "📦 Image: student-management-system:latest"
        echo "🚀 Ready for deployment!"
        echo ""
        echo "To run locally:"
        echo "docker run -p 8501:8501 student-management-system:latest"